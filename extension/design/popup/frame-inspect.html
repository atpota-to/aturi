<!doctype html>
<html lang="en" data-theme="light" data-fs="medium">
<head>
<meta charset="utf-8">
<title>Inspect mockup</title>
<link rel="stylesheet" href="../../../entrypoints/shared.css">
<link rel="stylesheet" href="../../../entrypoints/popup/popup.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Chrome only. The extension's own popup.css draws it; nothing here is
     part of the mockup. */
  html, body { margin: 0; }
  body { width: 380px; font-family: var(--font-sans); color: var(--text-primary); background: var(--bg-primary); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: var(--text-accent); text-decoration: none; }
  .popup-icon-btn svg { display: block; }
</style>
</head>
<body>
<div class="popup-shell">
  <header class="popup-topbar">
    <div class="popup-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      <span>aturi</span>
    </div>
    <div class="popup-mode-tabs" role="tablist" aria-label="Popup mode">
      <button type="button" role="tab" aria-selected="false" tabindex="-1" class="popup-mode-tab"><span class="popup-mode-tab-label" data-label="Waypoints">Waypoints</span></button>
      <button type="button" role="tab" aria-selected="true" class="popup-mode-tab is-active"><span class="popup-mode-tab-label" data-label="Inspect">Inspect</span><span class="popup-mode-tab-badge">7</span></button>
    </div>
    <div class="popup-topbar-actions">
      <button type="button" class="popup-icon-btn" aria-label="Switch to dark theme"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      <button type="button" class="popup-icon-btn" aria-label="Open extension settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></button>
    </div>
  </header>
  <main class="popup-body">
<!-- BODY -->
  </main>
  <footer class="popup-redirect">
    <svg class="popup-redirect-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>
    <span class="popup-redirect-label"><span class="popup-redirect-title">Auto-redirect</span></span>
    <button type="button" role="switch" aria-checked="false" class="aturi-switch aturi-switch-sm" aria-label="Auto-redirect"><span class="popup-redirect-state">Off</span><span class="aturi-switch-box" aria-hidden="true"></span></button>
  </footer>
</div>
</body>
</html>
