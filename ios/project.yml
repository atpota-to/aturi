# XcodeGen spec for the iOS app. Regenerate the project after editing this
# file or adding sources:
#
#   cd ios && xcodegen generate
#
# The .xcodeproj is committed so the project opens without tooling, but this
# file is the source of truth; hand edits to the project are overwritten.
name: Aturi

options:
  bundleIdPrefix: to.aturi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # Keep the generated project stable across machines so the committed
  # pbxproj does not churn.
  useBaseInternationalization: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is per-developer. Set your team in Xcode's Signing & Capabilities
    # tab, or export DEVELOPMENT_TEAM before generating.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

packages:
  AturiCore:
    path: Packages/AturiCore

targets:
  Aturi:
    type: application
    platform: iOS
    sources:
      - path: Aturi
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: AturiCore
        product: AturiCore
      - target: AturiShare
        embed: true
        codeSign: true
    info:
      path: Aturi/Info.plist
      properties:
        CFBundleDisplayName: Aturi
        CFBundleName: Aturi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        UIApplicationSupportsIndirectInputEvents: true
        # Three URL schemes. `aturi` is the app's own (the share extension
        # hands links over with aturi://open?url=...). `at` lets any app that
        # emits raw AT URIs open them here. `to.aturi` is the OAuth redirect
        # scheme: atproto requires a native client's custom scheme to be the
        # reverse of the client_id host, and the client_id is served from
        # aturi.to.
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: to.aturi.app.links
            CFBundleURLSchemes: [aturi, at]
          - CFBundleTypeRole: Viewer
            CFBundleURLName: to.aturi.app.oauth
            CFBundleURLSchemes: [to.aturi]
        # Compose-intent deep links check whether the Bluesky app is installed
        # before offering its bluesky:// scheme.
        LSApplicationQueriesSchemes: [bluesky]
    entitlements:
      path: Aturi/Aturi.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:aturi.to
        com.apple.security.application-groups:
          - group.to.aturi.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.aturi.app
        PRODUCT_NAME: Aturi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  AturiShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AturiShare
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: AturiCore
        product: AturiCore
    info:
      path: AturiShare/Info.plist
      properties:
        CFBundleDisplayName: Open in Aturi
        CFBundleName: AturiShare
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: AturiShare/AturiShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.to.aturi.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.aturi.app.share
        PRODUCT_NAME: AturiShare
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Aturi:
    build:
      targets:
        Aturi: all
        AturiShare: [build]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AturiCore/AturiCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
