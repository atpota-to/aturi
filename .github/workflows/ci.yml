name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Keep the build deterministic; no secrets are required.
          NEXT_TELEMETRY_DISABLED: "1"

  extension:
    name: Extension (typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # The extension shares source with the web app through the @aturi/* alias
      # (../src/utils/**). Those files import root deps such as @atproto/api and
      # react, so the extension typecheck needs the root packages installed too.
      - run: npm ci
      - run: npm ci
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - run: npm test
        working-directory: extension

  packages:
    name: Packages (sync guard · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - run: npm ci
        working-directory: packages
      # One aggregate script rather than six hand-sequenced steps. The order is
      # load-bearing — waypoints-react resolves the core's types through its
      # built dist/, so a typecheck before the core build fails on a fresh
      # clone — and `npm run verify` is where that order is now defined, so it
      # is the same locally and here. Drift guard runs first: the published
      # packages ship standalone copies of the app's canonical src/utils files.
      - run: npm run verify
        working-directory: packages
      # Publish-surface gates for two packages that go to npm: publint checks
      # the manifest and exports map, attw checks that the types resolve for
      # both ESM and CJS consumers.
      - run: npx --yes publint
        working-directory: packages/waypoints
      - run: npx --yes @arethetypeswrong/cli --pack .
        working-directory: packages/waypoints
      - run: npx --yes publint
        working-directory: packages/waypoints-react
      # The styles.css subpath is excluded: it is a stylesheet, so it cannot
      # resolve as a module under node10/node16-CJS no matter how it is
      # declared, and a permanently-failing cell would make this gate noise.
      - run: npx --yes @arethetypeswrong/cli --pack . --exclude-entrypoints styles.css
        working-directory: packages/waypoints-react
