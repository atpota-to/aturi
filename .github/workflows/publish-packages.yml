name: Publish packages

# Publishes @aturi.to/waypoints and @aturi.to/waypoints-react to npm using
# trusted publishing (OIDC) - no NPM_TOKEN secret is involved. npm mints a
# short-lived credential for this exact workflow, so the trust is pinned to
# `atpota-to/aturi` + this filename. Renaming this file breaks publishing until
# the new name is re-registered on npm for BOTH packages.
#
# The `github-packages` job then mirrors the same two builds to GitHub Packages.
# npm is the primary registry; the mirror is a convenience for consumers who
# pull from GitHub. It publishes under `@atpota-to/*` because GitHub Packages
# only accepts a scope matching the repository owner - see
# .github/scripts/publish-github-package.sh.
#
# Releasing: bump both package.json versions, merge to main, then push a tag:
#   git tag v0.1.2 && git push origin v0.1.2
#
# Each package is skipped if its version is already on the registry, so re-runs
# are safe and bumping only one package doesn't fail the other. The two
# registries are tracked separately, so a mirror that failed on its own can be
# backfilled by re-running the workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, but skip the publish'
        type: boolean
        default: false

# Never let two releases race for the same version.
concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for publish rights

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/package-lock.json

      # Trusted publishing needs npm >= 11.5.1 and Node 22 still ships npm 10.x,
      # so npm has to be upgraded here. Held at 11.x deliberately: npm 12 wants
      # node ^22.22.2 || ^24.15.0 || >=26, and .nvmrc pins 22.22.0 - just under
      # that floor, so npm@latest fails to install. Widen this once .nvmrc moves.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install
        run: npm ci
        working-directory: packages

      # Same gates as the `packages` CI job. `prepublishOnly` re-runs the sync
      # guard and build at publish time too, but failing here keeps a bad build
      # from getting as far as the registry.
      - name: Sync guard
        run: npm run sync:check
        working-directory: packages/waypoints

      - name: Typecheck core
        run: npm run typecheck
        working-directory: packages/waypoints

      - name: Test core
        run: npm test
        working-directory: packages/waypoints

      - name: Build core
        run: npm run build
        working-directory: packages/waypoints

      - name: Typecheck react
        run: npm run typecheck
        working-directory: packages/waypoints-react

      - name: Build react
        run: npm run build
        working-directory: packages/waypoints-react

      # Core first: waypoints-react depends on it.
      - name: Publish @aturi.to/waypoints
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: ../../.github/scripts/publish-if-new.sh
        working-directory: packages/waypoints

      - name: Publish @aturi.to/waypoints-react
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: ../../.github/scripts/publish-if-new.sh
        working-directory: packages/waypoints-react

      - name: Report dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry run - built and verified, published nothing." >> "$GITHUB_STEP_SUMMARY"

  github-packages:
    name: Mirror to GitHub Packages
    needs: publish # npm is the source of truth; don't mirror a release that failed there
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN's publish rights on npm.pkg.github.com
    # Job-wide rather than per-step: setup-node writes a literal
    # `${NODE_AUTH_TOKEN}` into the .npmrc, and npm fails to parse that config
    # at all - `npm ci` included - if the variable is unset. npm only sends it
    # to npm.pkg.github.com, the host the token line is scoped to.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Writes `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}` plus
          # `@atpota-to:registry=https://npm.pkg.github.com/` - with no `scope`
          # input, setup-node defaults it to the lowercased repository owner,
          # which is exactly the scope GitHub Packages demands. The default
          # registry is left alone, so `npm ci` still installs from npmjs.
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install
        run: npm ci
        working-directory: packages

      # The gates already ran in `publish`, and `prepublishOnly` rebuilds each
      # package at publish time anyway - but waypoints-react's .d.ts build
      # resolves @aturi.to/waypoints through the workspace symlink, so core's
      # dist has to exist even on a run where core itself is skipped as
      # already-mirrored.
      - name: Build core
        run: npm run build
        working-directory: packages/waypoints

      - name: Build react
        run: npm run build
        working-directory: packages/waypoints-react

      - name: Publish @atpota-to/waypoints
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: ../../.github/scripts/publish-github-package.sh
        working-directory: packages/waypoints

      - name: Publish @atpota-to/waypoints-react
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: ../../.github/scripts/publish-github-package.sh
        working-directory: packages/waypoints-react

      - name: Report dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry run - mirrored nothing to GitHub Packages." >> "$GITHUB_STEP_SUMMARY"
